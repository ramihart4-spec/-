<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="غرزالدين">
<title>مجموعة غرزالدين التجارية</title>
<link id="fav" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏢%3C/text%3E%3C/svg%3E">
<link id="aicon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏢%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--bg3:#1a1e2a;--card:#1e2330;--card2:#242838;--acc:#ff6b35;--gold:#f5c518;--grn:#22c55e;--red:#ef4444;--blu:#3b82f6;--pur:#a855f7;--txt:#f0f2ff;--t2:#8b92a8;--brd:#2a2f3e}
.day{--bg:#f4f6fa;--bg3:#dde3ed;--card:#fff;--card2:#f0f4f8;--txt:#1a2030;--t2:#4a5568;--brd:#c5cdd8;--acc:#e85d2a;--gold:#b8860b;--grn:#16a34a;--red:#dc2626;--blu:#2563eb;--pur:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt)}
#A{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.scr{display:none;width:100%;height:100%}
.scr.v{display:flex;flex-direction:column}
#LS{background:var(--bg);align-items:center;justify-content:center;padding:16px;overflow-y:auto}
/* LOGIN */
.lc{background:var(--card);border-radius:22px;padding:22px 18px;width:100%;max-width:340px;border:1px solid var(--brd)}
.ll{text-align:center;margin-bottom:16px}
.li{width:68px;height:68px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--gold));display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:8px;overflow:hidden}
.li img{width:100%;height:100%;object-fit:cover}
.ln{font-size:16px;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lt{display:flex;flex-wrap:wrap;gap:3px;background:var(--bg3);padding:3px;border-radius:11px;margin-bottom:12px}
.ltb{flex:1;min-width:55px;padding:5px 3px;border:none;background:transparent;color:var(--t2);font-family:inherit;font-size:9px;font-weight:700;border-radius:8px;cursor:pointer}
.ltb.a{background:var(--acc);color:#fff}
.lf{margin-bottom:8px}
.lf input{width:100%;padding:10px 12px;background:var(--bg3);border:1.5px solid var(--brd);border-radius:10px;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
.lf input:focus{border-color:var(--acc)}
.lr{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.lr input{width:15px;height:15px;accent-color:var(--acc)}
.lr label{font-size:10px;color:var(--t2);cursor:pointer}
.lb{width:100%;padding:12px;background:linear-gradient(135deg,var(--acc),#d94e1f);border:none;border-radius:11px;color:#fff;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.le{color:var(--red);font-size:10px;text-align:center;margin-top:5px;display:none}
.lh{margin-top:10px;padding:8px;background:var(--bg3);border-radius:8px;font-size:9px;color:var(--t2);line-height:2}
/* TOPBAR */
.tb{background:var(--card);border-bottom:1px solid var(--brd);padding:0 8px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tbl{display:flex;align-items:center;gap:7px}
.ti{width:36px;height:36px;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,var(--acc),var(--gold));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ti img{width:100%;height:100%;object-fit:cover}
.tn{font-size:14px;font-weight:900;color:var(--txt)}
.tbr{display:flex;align-items:center;gap:3px}
.ib{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg3);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;position:relative;flex-shrink:0}
.ib.wa{background:#25d366;color:#fff}.ib.fb{background:#1877f2;color:#fff}
.ib.ex{background:rgba(239,68,68,.15);color:var(--red)}
.nb{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:50%;width:13px;height:13px;font-size:7px;display:none;align-items:center;justify-content:center}
/* CONTENT */
.cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:9px;background:var(--bg)}
/* NAV */
.bn{background:var(--card);border-top:1px solid var(--brd);display:flex;overflow-x:auto;scrollbar-width:none;flex-shrink:0;padding:0 2px}
.bn::-webkit-scrollbar{display:none}
.bni{display:flex;flex-direction:column;align-items:center;padding:5px 7px;border:none;background:transparent;color:var(--t2);font-family:inherit;font-size:9px;font-weight:700;cursor:pointer;white-space:nowrap;min-width:46px;flex-shrink:0}
.bni .ic{font-size:16px;margin-bottom:1px}
.bni.a{color:var(--acc)}
/* PANELS */
.pnl{display:none}.pnl.v{display:block}
/* HERO */
.hero{background:linear-gradient(135deg,var(--card),var(--bg3));border-radius:14px;padding:13px;margin-bottom:10px;border:1px solid var(--brd)}
.hero h2{font-size:14px;font-weight:900;margin-bottom:2px}
.hero p{font-size:9px;color:var(--t2);margin-bottom:8px}
.hb{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.hbtn{padding:7px 11px;border-radius:9px;border:none;font-family:inherit;font-size:10px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:4px}
.hbtn.wa{background:#25d366;color:#fff}.hbtn.mp{background:var(--bg3);border:1px solid var(--brd);color:var(--txt)}.hbtn.fb{background:#1877f2;color:#fff}
.rb{background:var(--bg3);border-radius:9px;padding:8px;border:1px solid var(--brd)}
.rt{font-size:9px;color:var(--t2);font-weight:700;text-align:center;margin-bottom:5px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rc{border-radius:8px;padding:7px;text-align:center}
.rc.b{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.rc.s{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.rl{font-size:9px;font-weight:700;margin-bottom:2px}
.rv{font-size:14px;font-weight:900}
.ru{font-size:8px;color:var(--t2)}
/* CHIPS */
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:4px 10px;border-radius:20px;border:1.5px solid var(--brd);background:var(--card);color:var(--t2);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.a{background:var(--acc);border-color:var(--acc);color:#fff}
.bts{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:7px}
.bts::-webkit-scrollbar{display:none}
.bbt{padding:5px 11px;border-radius:20px;border:1.5px solid var(--brd);background:var(--card);color:var(--t2);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.bbt.a{background:var(--acc);border-color:var(--acc);color:#fff}
.baddr{background:var(--acc);border-radius:7px;padding:5px 9px;font-size:9px;color:#fff;margin-bottom:7px;font-weight:700}
.srch input{width:100%;padding:8px 11px;background:var(--card);border:1.5px solid var(--brd);border-radius:10px;color:var(--txt);font-family:inherit;font-size:11px;outline:none;margin-bottom:8px}
.srch input:focus{border-color:var(--acc)}
/* PRODUCT GRID */
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pc{background:var(--card);border-radius:11px;overflow:hidden;border:1px solid var(--brd)}
.pci{height:95px;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pci img{width:100%;height:100%;object-fit:cover}
.pci .em{font-size:34px}
.pcb{padding:7px}
.pcn{font-size:11px;font-weight:800;margin-bottom:2px;line-height:1.3}
.pcc{font-size:8px;color:var(--t2);margin-bottom:2px}
.pcp{font-size:13px;font-weight:900;color:var(--acc);margin-bottom:2px}
.pcs{font-size:8px;color:var(--t2);margin-bottom:5px}
.badd{width:100%;padding:5px;background:var(--blu);border:none;border-radius:6px;color:#fff;font-family:inherit;font-size:9px;font-weight:800;cursor:pointer}
.bwa2{width:100%;padding:5px;background:#25d366;border:none;border-radius:6px;color:#fff;font-family:inherit;font-size:9px;font-weight:800;cursor:pointer;margin-top:3px}
/* CARD */
.cd{background:var(--card);border:1px solid var(--brd);border-radius:11px;padding:10px;margin-bottom:7px}
.cdt{font-size:12px;font-weight:800;margin-bottom:8px}
/* STATS */
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:9px}
.st{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:9px;text-align:center}
.sv{font-size:15px;font-weight:900;margin-bottom:2px}
.sl{font-size:8px;color:var(--t2)}
/* SEC HDR */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-wrap:wrap;gap:5px}
.st2{font-size:14px;font-weight:800}
/* BUTTONS */
.btn{padding:6px 11px;border-radius:8px;border:none;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.bac{background:var(--acc);color:#fff}.bgn{background:var(--grn);color:#fff}
.brd{background:var(--red);color:#fff}.bgh{background:var(--bg3);border:1px solid var(--brd);color:var(--txt)}
.bgo{background:var(--gold);color:#1a1a1a}.bsm{padding:3px 8px;font-size:9px}
.bpur{background:var(--pur);color:#fff}
/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:800}
.bg{background:rgba(34,197,94,.2);color:var(--grn)}.br2{background:rgba(239,68,68,.2);color:var(--red)}
.ba{background:rgba(255,107,53,.2);color:var(--acc)}.bb{background:rgba(59,130,246,.2);color:var(--blu)}
.bp{background:rgba(168,85,247,.2);color:var(--pur)}.bgo2{background:rgba(245,197,24,.2);color:var(--gold)}
/* INV BAR */
.ib2{background:var(--bg3);border-radius:3px;height:4px;overflow:hidden;margin:3px 0}
.if2{height:100%;border-radius:3px}
/* CART */
.ci{background:var(--bg3);border-radius:9px;padding:7px;margin-bottom:5px;display:flex;align-items:center;gap:5px;font-size:10px}
.cq{width:38px;padding:3px;background:var(--bg);border:1px solid var(--brd);border-radius:5px;color:var(--txt);text-align:center;font-family:inherit;font-size:10px}
/* TABLE */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:440px;font-size:9px}
th{background:var(--bg3);padding:6px;text-align:right;color:var(--t2);font-weight:800;border-bottom:1px solid var(--brd);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--brd);vertical-align:middle}
/* EMP */
.ec{background:var(--card);border:1px solid var(--brd);border-radius:11px;padding:9px;margin-bottom:6px}
.et{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.ea{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--gold));display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:flex-end;justify-content:center}
.ov.v{display:flex}
.mb{background:var(--card2);border-radius:20px 20px 0 0;padding:15px 13px 26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border:1px solid var(--brd)}
.md{width:32px;height:3px;background:var(--brd);border-radius:2px;margin:0 auto 13px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mt{font-size:14px;font-weight:900}
.mc{width:26px;height:26px;background:var(--bg3);border:none;border-radius:6px;color:var(--t2);cursor:pointer;font-size:12px}
.fg{margin-bottom:9px}
.fg label{display:block;font-size:9px;font-weight:800;color:var(--t2);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px;background:var(--bg3);border:1.5px solid var(--brd);border-radius:9px;color:var(--txt);font-family:inherit;font-size:12px;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--acc)}
.fg select option{background:var(--bg3)}
.mbtns{display:flex;gap:6px;margin-top:12px}
.mbtns .btn{flex:1;justify-content:center;padding:10px}
.iupa{display:flex;align-items:center;gap:7px;margin-top:5px}
.iprev{width:50px;height:50px;background:var(--bg3);border:2px dashed var(--brd);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;flex-shrink:0}
.iprev img{width:100%;height:100%;object-fit:cover}
/* CHAT MSG */
.cmsg{background:var(--bg3);border-radius:9px;padding:7px;margin-bottom:5px}
.cmsg.mine{background:rgba(255,107,53,.15);border:1px solid rgba(255,107,53,.3)}
.cmsg.unread{border:1px solid var(--acc)}
/* TOAST */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card2);border:1px solid var(--brd);color:var(--txt);padding:8px 14px;border-radius:9px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none}
.toast.v{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:28px 12px;color:var(--t2)}
.ei{font-size:38px;margin-bottom:7px}
/* PULSE ANIM for new msg */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}70%{box-shadow:0 0 0 8px rgba(255,107,53,0)}}
.pulsing{animation:pulse 1s infinite}
</style>
</head>
<body>
<div id="A">
<!-- LOGIN -->
<div id="LS" class="scr v">
<div class="lc">
  <div class="ll">
    <div class="li" id="LL">🏢</div>
    <div class="ln" id="loginName">مجموعة غرزالدين التجارية</div>
  </div>
  <div class="lt">
    <button class="ltb a" onclick="setTab('admin',this)">مدير عام</button>
    <button class="ltb" onclick="setTab('br',this)">رئيس فرع</button>
    <button class="ltb" onclick="setTab('dept',this)">رئيس قسم</button>
    <button class="ltb" onclick="setTab('emp',this)">موظف</button>
    <button class="ltb" onclick="setTab('guest',this)">زبون</button>
  </div>
  <div class="lf"><input id="lU" placeholder="اسم المستخدم" autocomplete="username"></div>
  <div class="lf" id="lPW"><input id="lP" type="password" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter')doLogin()"></div>
  <div class="lr"><input type="checkbox" id="remMe"><label for="remMe">تذكّرني</label></div>
  <button class="lb" onclick="doLogin()">دخول ←</button>
  <div class="le" id="lErr">❌ بيانات خاطئة</div>
  <div class="lh">admin/admin123 | oldtown/123 | castle/123 | souk/123 | emp1/emp123</div>
</div>
</div>
<!-- APP -->
<div id="AS" class="scr">
  <div class="tb">
    <div class="tbl">
      <div class="ti" id="TI">🏢</div>
      <div class="tn" id="TN">غرزالدين</div>
    </div>
    <div class="tbr">
      <button class="ib wa" onclick="openWA()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.533 5.845L.057 23.492c-.083.334.239.632.568.527l5.845-1.867A11.948 11.948 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg></button>
      <button class="ib fb" onclick="openFB()"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></button>
      <button class="ib" onclick="openGPS()">📍</button>
      <button class="ib" onclick="openMsgModal()" id="msgBtn">💬<span class="nb" id="msgBdg">0</span></button>
      <button class="ib" id="rateBtn" onclick="editRate()" style="background:rgba(245,197,24,.15);color:var(--gold)">💵</button>
      <button class="ib" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <button class="ib ex" onclick="doLogout()">🚪</button>
    </div>
  </div>
  <div class="cnt">
    <div class="pnl v" id="pStore"></div>
    <div class="pnl" id="pCart"></div>
    <div class="pnl" id="pInv"></div>
    <div class="pnl" id="pRep"></div>
    <div class="pnl" id="pWallet"></div>
    <div class="pnl" id="pDebt"></div>
    <div class="pnl" id="pExp"></div>
    <div class="pnl" id="pPersonal"></div>
    <div class="pnl" id="pEmp"></div>
    <div class="pnl" id="pSet"></div>
  </div>
  <div class="bn" id="bnav">
    <button class="bni a" data-p="pStore"><span class="ic">🏠</span>المتجر</button>
    <button class="bni" data-p="pCart" id="nCart"><span class="ic">🛒</span>السلة<span class="nb" id="cBdg">0</span></button>
    <button class="bni" data-p="pInv" id="nInv"><span class="ic">📦</span>المخزون</button>
    <button class="bni" data-p="pRep" id="nRep"><span class="ic">📊</span>التقارير</button>
    <button class="bni" data-p="pWallet" id="nWal"><span class="ic">💰</span>المحفظة</button>
    <button class="bni" data-p="pDebt" id="nDebt"><span class="ic">📒</span>الديون</button>
    <button class="bni" data-p="pExp" id="nExp"><span class="ic">💸</span>المصاريف</button>
    <button class="bni" data-p="pPersonal" id="nPers"><span class="ic">👤</span>حسابي</button>
    <button class="bni" data-p="pEmp" id="nEmp"><span class="ic">👥</span>الموظفون</button>
    <button class="bni" data-p="pSet" id="nSet"><span class="ic">⚙️</span>الإعدادات</button>
  </div>
</div>
</div>
<!-- MODALS -->
<!-- Product Modal -->
<div class="ov" id="mProd"><div class="mb">
  <div class="md"></div>
  <div class="mh"><div class="mt" id="mPT">منتج</div><button class="mc" onclick="co('mProd')">✕</button></div>
  <div class="fg"><label>اسم المنتج</label><input id="pN"></div>
  <div class="fg"><label>القسم</label><select id="pCat"></select></div>
  <div id="adminPF">
    <div class="fg"><label>سعر البيع بالمفرق (ل.س)</label><input id="pPrice" type="number"></div>
    <div class="fg"><label>سعر التكلفة / رأس المال (ل.س)</label><input id="pCost" type="number" value="0"></div>

// ══ MSG SOUND ══
function playMsgSound(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.setValueAtTime(1100,ctx.currentTime+0.1);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.3);}catch(e){}
}

// ══ REAL-TIME MSG POLLING ══
function startMsgPoll(){
  clearInterval(msgPollT);
  msgPollT=setInterval(()=>{
    const stored=JSON.parse(localStorage.getItem('gz_m')||'[]');
    const newUnread=stored.filter(m=>m.to===me?.username&&!m.read&&!msgs.find(x=>x.id===m.id));
    if(newUnread.length>0){
      msgs=stored;
      playMsgSound();
      updateMsgBdg();
      // Show notification
      newUnread.forEach(m=>{
        const sender=users.find(u=>u.username===m.from)?.name||m.from;
        toast(`💬 رسالة من ${sender}: ${m.text.slice(0,30)}`,'msg');
        // Pulse msg button
        const btn=document.getElementById('msgBtn');
        btn.classList.add('pulsing');
        setTimeout(()=>btn.classList.remove('pulsing'),3000);
      });
    } else {
      msgs=stored;
      updateMsgBdg();
    }
  },3000);
}

// ══ WEIGHT ══
function openWtM(prodId,brId){
  wtProd=prods.find(p=>p.id==prodId);wtBr=brId;if(!wtProd)return;
  document.getElementById('mWtT').textContent=`⚖️ ${wtProd.name}`;
  document.getElementById('wtPD').textContent=`${wtProd.price.toLocaleString('ar-SY')} ل.س / ${ul(wtProd.unit)||'وحدة'}`;
  document.getElementById('wtAm').value='';document.getElementById('wtQ').value='';
  document.getElementById('wtCalc').style.display='none';document.getElementById('wtTot').textContent='';
  document.getElementById('mWt').classList.add('v');
}
function calcWtAm(){
  const am=parseFloat(document.getElementById('wtAm').value)||0;
  if(!am){document.getElementById('wtCalc').style.display='none';return;}
  const qty=am/wtProd.price;
  document.getElementById('wtWR').textContent=`${qty.toFixed(3)} ${ul(wtProd.unit)}`;
  document.getElementById('wtCalc').style.display='block';
  document.getElementById('wtQ').value=qty.toFixed(3);
  document.getElementById('wtTot').textContent=`الإجمالي: ${am.toLocaleString('ar-SY')} ل.س`;
}
function calcWtQ(){
  const qty=parseFloat(document.getElementById('wtQ').value)||0;
  if(!qty){document.getElementById('wtTot').textContent='';return;}
  document.getElementById('wtTot').textContent=`الإجمالي: ${(qty*wtProd.price).toLocaleString('ar-SY')} ل.س`;
}
function confirmWt(){
  const qty=parseFloat(document.getElementById('wtQ').value);
  if(!qty||qty<=0){toast('⚠️ أدخل الكمية','e');return;}
  if(qty>(wtProd.stock[wtBr]||0)){toast('❌ الكمية غير كافية','e');return;}
  const ex=cart.find(i=>i.prodId==wtProd.id&&i.branchId==wtBr);
  if(ex)ex.qty+=qty;else cart.push({prodId:wtProd.id,branchId:wtBr,name:wtProd.name,price:wtProd.price,cost:wtProd.cost||0,cat:wtProd.cat,qty,unit:wtProd.unit});
  localStorage.setItem('gz_c',JSON.stringify(cart));updateCartBdg();toast(`✅ ${wtProd.name} - ${qty} ${ul(wtProd.unit)}`);co('mWt');
}

// ══ CART ══
function addCart(prodId,brId,qty=1){
  const p=prods.find(x=>x.id==prodId);if(!p)return;
  const st=p.stock[brId]||0;if(st<qty){toast('❌ غير متوفر','e');return;}
  const ex=cart.find(i=>i.prodId==prodId&&i.branchId==brId);
  if(ex){if(ex.qty+qty>st){toast('❌ غير كافية','e');return;}ex.qty+=qty;}
  else cart.push({prodId,branchId:brId,name:p.name,price:p.price,cost:p.cost||0,cat:p.cat,qty,unit:p.unit||'piece'});
  localStorage.setItem('gz_c',JSON.stringify(cart));updateCartBdg();toast(`✅ ${p.name}`);
}
function updateCartBdg(){const t=cart.reduce((s,i)=>s+i.qty,0);const b=document.getElementById('cBdg');if(b){b.textContent=Math.round(t);b.style.display=t>0?'flex':'none';}}
function renderCart(){
  const el=document.getElementById('pCart');
  if(!cart.length){el.innerHTML='<div class="empty"><div class="ei">🛒</div><p>السلة فارغة</p></div>';return;}
  let tot=0;
  const items=cart.map((item,i)=>{const it=item.price*item.qty;tot+=it;const u=ul(item.unit);return `<div class="ci"><div style="flex:1"><div style="font-weight:800;font-size:11px">${item.name}</div><div style="font-size:8px;color:var(--t2)">${BC[item.branchId]?.name||item.branchId}</div></div><input class="cq" type="number" min="0.01" step="${item.unit==='piece'?1:0.1}" value="${item.qty}" onchange="updQty(${i},this.value)"><span style="font-size:8px;color:var(--t2)">${u}</span><div style="font-weight:800;font-size:10px;color:var(--acc)">${it.toLocaleString()}</div><button class="btn brd bsm" onclick="rmCart(${i})">✕</button></div>`;}).join('');
  el.innerHTML=`<div class="sh"><div class="st2">🛒 السلة</div></div>${items}<div style="background:var(--acc);border-radius:10px;padding:10px;text-align:center;margin:9px 0;font-weight:900;font-size:13px">الإجمالي: ${tot.toLocaleString('ar-SY')} ل.س</div><div style="display:flex;gap:5px"><button class="btn bgn" style="flex:1;justify-content:center;padding:10px" onclick="checkout('cash')">💵 كاش</button><button class="btn bgh" style="flex:1;justify-content:center;padding:10px" onclick="checkout('credit')">📝 دين</button></div>`;
}
function updQty(i,v){v=parseFloat(v);if(!v||v<=0){rmCart(i);return;}const item=cart[i];const p=prods.find(x=>x.id==item.prodId);if(p&&(p.stock[item.branchId]||0)>=v){cart[i].qty=v;localStorage.setItem('gz_c',JSON.stringify(cart));updateCartBdg();renderCart();}else toast('❌ غير كافية','e');}
function rmCart(i){cart.splice(i,1);localStorage.setItem('gz_c',JSON.stringify(cart));updateCartBdg();renderCart();}
function checkout(method){
  if(!cart.length){toast('السلة فارغة','e');return;}
  for(const item of cart){const p=prods.find(x=>x.id==item.prodId);if(!p||(p.stock[item.branchId]||0)<item.qty){toast(`❌ ${item.name} غير متوفر`,'e');return;}}
  if(method==='credit'){openDebtFromCart();return;}
  processCheckout(method,'');
}
function processCheckout(method,debtorName){
  for(const item of cart){
    const p=prods.find(x=>x.id==item.prodId);
    p.stock[item.branchId]=(p.stock[item.branchId]||0)-item.qty;
    const total=item.price*item.qty,profit=(item.price-item.cost)*item.qty;
    const partner=isPartner(item.branchId,item.cat);
    const myProfit=partner?(profit*partnerShare/100):profit;
    const partnerProfit=partner?(profit*(1-partnerShare/100)):0;
    sales.unshift({id:Date.now()+Math.random(),branchId:item.branchId,branchName:BC[item.branchId]?.name||item.branchId,prodId:item.prodId,prodName:item.name,cat:item.cat,qty:item.qty,unit:item.unit||'piece',price:item.price,cost:item.cost||0,total,profit,myProfit,partnerProfit,isPartner:partner,date:new Date().toLocaleString(),dateOnly:new Date().toISOString().slice(0,10),seller:me.username,method,debtorName});
    if((p.stock[item.branchId]||0)<5)msgs.push({id:Date.now()+Math.random(),from:me.username,to:'admin',text:`🔔 ${p.name} في ${BC[item.branchId]?.name} أصبح ${p.stock[item.branchId]||0} فقط`,time:new Date().toLocaleString(),read:false});
  }
  save();cart=[];localStorage.setItem('gz_c',JSON.stringify(cart));updateCartBdg();
  toast(`✅ تم البيع (${method==='cash'?'كاش':'دين'})${debtorName?' - '+debtorName:''}`);
  renderCart();
  if(document.getElementById('pStore').classList.contains('v'))renderStore();
}
function openDebtFromCart(){
  const tot=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const det=cart.map(i=>`${i.name}(${i.qty})`).join('،');
  const brId=cart[0]?.branchId||me.branchId||'oldtown';
  document.getElementById('dBr').innerHTML=Object.entries(BC).map(([id,v])=>`<option value="${id}" ${id===brId?'selected':''}>${v.name}</option>`).join('');
  document.getElementById('dN').value='';document.getElementById('dPh').value='';
  document.getElementById('dAm').value=Math.round(tot);document.getElementById('dDet').value=det;
  document.getElementById('mDebt').classList.add('v');
}

        <div style="font-weight:800;font-size:12px">${p.name}</div>
        <div style="font-size:8px;color:var(--t2)">${p.cat} | ${p.price.toLocaleString()} ل.س${u?' / '+u:''} ${isAdmin?`| تكلفة: ${(p.cost||0).toLocaleString()}`:''}  </div>
        <div class="ib2"><div class="if2" style="width:${fill}%;background:${low?'var(--red)':'var(--grn)'}"></div></div>
        <div style="font-size:8px;color:${low?'var(--red)':'var(--t2)'};">${sTxt.trim()}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px">${editBtn}</div>
    </div></div>`;
  }).join('');
}

// Stock-only modal for non-admin
function openStockModal(id){
  const p=prods.find(x=>x.id==id);if(!p)return;
  const myBrs=getMyBrs().filter(bid=>BC[bid]?.cats.includes(p.cat));
  const existing=document.getElementById('mStockOnly');if(existing)existing.remove();
  const ov=document.createElement('div');ov.className='ov v';ov.id='mStockOnly';
  let stockInputs=myBrs.map(bid=>`<div class="fg"><label>${BC[bid]?.name||bid}</label><input type="number" id="so_${bid}" value="${p.stock[bid]||0}"></div>`).join('');
  ov.innerHTML=`<div class="mb"><div class="md"></div><div class="mh"><div class="mt">📦 ${p.name}</div><button class="mc" onclick="document.getElementById('mStockOnly').remove()">✕</button></div>
    <div style="background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.3);border-radius:9px;padding:9px;margin-bottom:10px;font-size:10px;color:var(--t2)">⚠️ يمكنك تعديل المخزون والوصف فقط. الأسعار يحددها المدير العام.</div>
    <div class="fg"><label>الوصف</label><input id="soDesc" value="${p.desc||''}"></div>
    <div class="fg"><label>إضافة صورة</label><div class="iupa"><div class="iprev" id="soImgPrev">${p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`:'📷'}</div><div style="flex:1"><input type="file" id="soImgFile" accept="image/*" style="display:none" onchange="prevSoImg(this)"><button class="btn bgh" style="width:100%;justify-content:center;font-size:9px" onclick="document.getElementById('soImgFile').click()">📁 صورة</button></div></div><input type="hidden" id="soImgD"></div>
    ${stockInputs}
    <div class="mbtns"><button class="btn bac" onclick="saveStockOnly(${p.id})">💾 حفظ</button><button class="btn bgh" onclick="document.getElementById('mStockOnly').remove()">إلغاء</button></div></div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});

function prevSoImg(input){if(!input.files||!input.files[0])return;const r=new FileReader();r.onload=e=>{document.getElementById('soImgD').value=e.target.result;document.getElementById('soImgPrev').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;};r.readAsDataURL(input.files[0]);}
function saveStockOnly(id){
  const p=prods.find(x=>x.id==id);if(!p)return;
  p.desc=document.getElementById('soDesc').value;
  const img=document.getElementById('soImgD').value;if(img)p.img=img;
  const myBrs=getMyBrs().filter(bid=>BC[bid]?.cats.includes(p.cat));
  myBrs.forEach(bid=>{const inp=document.getElementById(`so_${bid}`);if(inp)p.stock[bid]=parseFloat(inp.value)||0;});
  save();document.getElementById('mStockOnly')?.remove();filterInv();
  if(document.getElementById('pStore').classList.contains('v'))filterSG();
  toast('✅ تم التحديث فوراً');
}

function openProdModal(id){
  editPId=id||null;
  const isAdmin=me.role==='مدير عام';
  document.getElementById('mPT').textContent=id?'✏️ تعديل منتج':'➕ إضافة منتج';
  document.getElementById('pCat').innerHTML=(isAdmin?ALL_CATS:getMyC()).map(c=>`<option>${c}</option>`).join('');
  document.getElementById('adminPF').style.display=isAdmin?'block':'none';
  document.getElementById('adminImgF').style.display=isAdmin?'block':'none';
  // Build stock fields
  const sfc=document.getElementById('stockFieldsContainer');
  sfc.innerHTML=Object.entries(BC).map(([bid,bv])=>`<div class="fg"><label>مخزون ${bv.name}</label><input type="number" id="pSt_${bid}" value="0"></div>`).join('');
  if(id){
    const p=prods.find(x=>x.id==id);
    document.getElementById('pN').value=p.name;
    document.getElementById('pDesc').value=p.desc||'';
    document.getElementById('pCat').value=p.cat;
    if(isAdmin){
      document.getElementById('pPrice').value=p.price;
      document.getElementById('pCost').value=p.cost||0;
      document.getElementById('pUnit').value=p.unit||'piece';
      document.getElementById('pImgD').value=p.img||'';
      document.getElementById('pImgPrev').innerHTML=p.img?`<img src="${p.img}" style="width:100%;height:100%;object-fit:cover">`:'📷';
    }
    Object.keys(BC).forEach(bid=>{const el=document.getElementById(`pSt_${bid}`);if(el)el.value=p.stock[bid]||0;});
  } else {
    ['pN','pDesc'].forEach(f=>document.getElementById(f).value='');
    if(isAdmin){document.getElementById('pPrice').value='';document.getElementById('pCost').value='';document.getElementById('pImgD').value='';document.getElementById('pImgPrev').innerHTML='📷';}
  }
  document.getElementById('mProd').classList.add('v');
}
function prevImg(input){if(!input.files||!input.files[0])return;const r=new FileReader();r.onload=e=>{document.getElementById('pImgD').value=e.target.result;document.getElementById('pImgPrev').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover">`;};r.readAsDataURL(input.files[0]);}
function clrImg(){document.getElementById('pImgD').value='';document.getElementById('pImgPrev').innerHTML='📷';document.getElementById('pImgFile').value='';}
function saveProd(){
  const isAdmin=me.role==='مدير عام';
  const name=document.getElementById('pN').value.trim();
  const cat=document.getElementById('pCat').value;
  const desc=document.getElementById('pDesc').value;
  if(!name){toast('⚠️ اسم المنتج مطلوب','e');return;}
  const stock={};
  Object.keys(BC).forEach(bid=>{const el=document.getElementById(`pSt_${bid}`);if(el)stock[bid]=parseFloat(el.value)||0;});
  if(isAdmin){
    const price=parseFloat(document.getElementById('pPrice').value);
    const cost=parseFloat(document.getElementById('pCost').value)||0;
    const unit=document.getElementById('pUnit').value;
    const img=document.getElementById('pImgD').value;
    if(isNaN(price)){toast('⚠️ السعر مطلوب','e');return;}
    if(editPId){const p=prods.find(x=>x.id==editPId);p.name=name;p.cat=cat;p.price=price;p.cost=cost;p.unit=unit;p.desc=desc;p.stock=stock;if(img)p.img=img;toast('✅ تم التعديل');}
    else{prods.push({id:nextPId++,name,cat,price,cost,unit,desc,stock,img});toast('✅ تمت الإضافة');}
  } else {
    if(!editPId){toast('❌ فقط المدير يضيف منتجات','e');return;}
    const p=prods.find(x=>x.id==editPId);
    p.name=name;p.desc=desc;
    getMyBrs().forEach(bid=>{const el=document.getElementById(`pSt_${bid}`);if(el&&BC[bid]?.cats.includes(cat))p.stock[bid]=parseFloat(el.value)||0;});
    toast('✅ تم التعديل');
  }
  save();co('mProd');filterInv();

function filterD(){
  const q=(document.getElementById('dSrch')?.value||'').toLowerCase(),filt=document.getElementById('dFilt')?.value||'all';
  const isAdmin=me.role==='مدير عام';
  let items=[...debts];
  if(!isAdmin&&me.branchId)items=items.filter(d=>d.branchId===me.branchId);
  if(filt==='unpaid')items=items.filter(d=>!d.paid);
  if(filt==='paid')items=items.filter(d=>d.paid);
  if(q)items=items.filter(d=>d.name.toLowerCase().includes(q)||String(d.amount).includes(q)||(d.details||'').toLowerCase().includes(q)||(d.phone||'').includes(q));
  const tot=items.filter(d=>!d.paid).reduce((s,d)=>s+d.amount,0),totP=items.filter(d=>d.paid).reduce((s,d)=>s+d.amount,0);
  document.getElementById('dStats').innerHTML=`<div class="sg" style="margin-bottom:7px"><div class="st"><div class="sv" style="color:var(--red)">${tot.toLocaleString()}</div><div class="sl">💸 الديون المتبقية</div></div><div class="st"><div class="sv" style="color:var(--grn)">${totP.toLocaleString()}</div><div class="sl">✅ المسدد</div></div></div>`;
  const dl=document.getElementById('dList');
  if(!items.length){dl.innerHTML='<div class="empty"><div class="ei">📒</div><p>لا توجد ديون</p></div>';return;}
  dl.innerHTML=items.map(d=>`<div class="cd" style="border-right:4px solid ${d.paid?'var(--grn)':'var(--red)'}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
      <div><div style="font-size:12px;font-weight:900">${d.name}</div>${d.phone?`<a href="tel:${d.phone}" style="font-size:9px;color:var(--blu);text-decoration:none">📞 ${d.phone}</a>`:''}</div>
      <div style="text-align:left"><div style="font-size:13px;font-weight:900;color:${d.paid?'var(--grn)':'var(--red)'}">${d.amount.toLocaleString()}</div><div style="font-size:7px;color:var(--t2)">ل.س</div></div>
    </div>
    ${d.details?`<div style="font-size:9px;color:var(--t2);margin-bottom:3px">📦 ${d.details}</div>`:''}
    <div style="font-size:8px;color:var(--t2);margin-bottom:6px">🏢 ${d.branchName} | 📅 ${d.date}</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">
      ${!d.paid?`<button class="btn bgn bsm" onclick="markPaid(${d.id})">✅ سدّد</button>`:'<span class="bdg bg">✅ مسدد</span>'}
      ${d.phone?`<button class="btn bsm" style="background:#25d366;color:#fff" onclick="waDebt('${d.phone}','${d.name}',${d.amount})">💬</button>`:''}
      <button class="btn brd bsm" onclick="delDebt(${d.id})">🗑️</button>
    </div>
  </div>`).join('');
}
function openDebtD(){
  document.getElementById('dBr').innerHTML=Object.entries(BC).map(([id,v])=>`<option value="${id}" ${me.branchId===id?'selected':''}>${v.name}</option>`).join('');
  ['dN','dPh','dDet'].forEach(f=>document.getElementById(f).value='');document.getElementById('dAm').value='';document.getElementById('mDebt').classList.add('v');
}
function markPaid(id){const d=debts.find(x=>x.id===id);if(d){d.paid=true;save();filterD();toast('✅ تم التسديد');}}
function delDebt(id){if(confirm('حذف؟')){debts=debts.filter(d=>d.id!=id);save();filterD();toast('🗑️ تم');}}
function waDebt(phone,name,amount){window.open(`https://wa.me/+${phone.replace(/\D/g,'')}?text=${encodeURIComponent(`السلام عليكم ${name}، يرجى تسديد مبلغ ${amount.toLocaleString()} ل.س. شكراً - ${storeName}`)}`,'_blank')}

// ══ EMPLOYEES ══
function renderEmp(){
  const el=document.getElementById('pEmp');if(me.role!=='مدير عام'){el.innerHTML='<div class="empty"><div class="ei">🔒</div><p>غير مصرح</p></div>';return;}
  const totSalary=users.reduce((a,b)=>a+(b.salary||0),0);
  el.innerHTML=`<div class="sh"><div class="st2">👥 الموظفون</div><button class="btn bac bsm" onclick="openUserModal()">➕ إضافة</button></div>
  <div class="cd" style="margin-bottom:10px;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3)">
    <div style="font-size:11px;font-weight:800;margin-bottom:3px">💰 إجمالي الرواتب الشهرية</div>
    <div style="font-size:20px;font-weight:900;color:var(--red)">${totSalary.toLocaleString()} ل.س</div>
  </div>
  ${users.map(u=>`<div class="ec">
    <div class="et">
      <div class="ea">${u.role==='مدير عام'?'👑':u.role==='رئيس فرع'?'🏢':u.role==='رئيس قسم'?'🧑‍💼':'👤'}</div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:800">${u.name}</div>
        <div style="font-size:9px;color:var(--t2)">@${u.username} | ${u.role}</div>
      </div>
      <div style="text-align:left;font-weight:800;font-size:11px;color:var(--red)">${(u.salary||0).toLocaleString()} ل.س/شهر</div>
    </div>
    <div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:7px">
      <span class="bdg ba">${u.role}</span>
      ${u.branchId?`<span class="bdg bb">${BC[u.branchId]?.name||u.branchId}</span>`:''}
    </div>
    <div style="display:flex;gap:4px">
      <button class="btn bac bsm" onclick="editUser(${u.id})">✏️ تعديل</button>
      ${u.username!=='admin'?`<button class="btn brd bsm" onclick="delUser(${u.id})">🗑️</button>`:''}
      <button class="btn bgn bsm" onclick="paySalary(${u.id})">💵 صرف راتب</button>
    </div>
  </div>`).join('')}`;
}
function paySalary(uid){
  const u=users.find(x=>x.id==uid);if(!u||!u.salary)return;
  const brId=u.branchId||Object.keys(BC)[0];
  if(confirm(`صرف راتب ${u.name}: ${u.salary.toLocaleString()} ل.س؟`)){
    expenses.unshift({id:Date.now(),type:'salary',desc:`راتب ${u.name}`,amount:u.salary,branchId:brId,date:new Date().toLocaleDateString('ar-SY'),by:me.username});
    save();renderEmp();toast(`✅ تم صرف راتب ${u.name}`);
  }
}
function openUserModal(id){
  document.getElementById('mUT').textContent=id?'✏️ تعديل مستخدم':'➕ إضافة مستخدم';
  document.getElementById('uB').innerHTML=Object.entries(BC).map(([id,v])=>`<option value="${id}">${v.name}</option>`).join('');
  document.getElementById('uD').innerHTML=ALL_CATS.map(c=>`<option>${c}</option>`).join('');
  if(id){const u=users.find(x=>x.id==id);document.getElementById('uN').value=u.name;document.getElementById('uU').value=u.username;document.getElementById('uP').value=u.password;document.getElementById('uR').value=u.role;if(u.branchId)document.getElementById('uB').value=u.branchId;if(u.dept)document.getElementById('uD').value=u.dept;document.getElementById('uSalary').value=u.salary||0;document.getElementById('mUser').dataset.eid=id;}
  else{['uN','uU','uP'].forEach(f=>document.getElementById(f).value='');document.getElementById('uR').value='موظف';document.getElementById('uSalary').value=0;delete document.getElementById('mUser').dataset.eid;}
  updUF();document.getElementById('mUser').classList.add('v');
}
function editUser(id){openUserModal(id);}
function updUF(){const r=document.getElementById('uR').value;document.getElementById('uBF').style.display=(r==='رئيس فرع'||r==='موظف')?'block':'none';document.getElementById('uDF').style.display=(r==='رئيس قسم')?'block':'none';}
function saveUser(){
  const name=document.getElementById('uN').value.trim(),username=document.getElementById('uU').value.trim(),password=document.getElementById('uP').value;
  const role=document.getElementById('uR').value,salary=parseFloat(document.getElementById('uSalary').value)||0;
  const branchId=(role==='رئيس فرع'||role==='موظف')?document.getElementById('uB').value:null;
  const dept=role==='رئيس قسم'?document.getElementById('uD').value:null;
  if(!name||!username||!password){toast('⚠️ الحقول مطلوبة','e');return;}
  const eid=document.getElementById('mUser').dataset.eid;
  if(eid){const u=users.find(x=>x.id==eid);u.name=name;u.username=username;u.password=password;u.role=role;u.branchId=branchId;u.dept=dept;u.salary=salary;toast('✅ تم التعديل');}
  else{if(users.find(u=>u.username===username)){toast('❌ اسم موجود','e');return;}users.push({id:nextUId++,name,username,password,role,branchId,dept,salary});toast('✅ تمت الإضافة');}
  save();co('mUser');renderEmp();
}
function delUser(id){if(confirm('حذف؟')){users=users.filter(u=>u.id!=id);save();renderEmp();toast('🗑️ تم');}}

// ══ SETTINGS ══
function renderSet(){
  const el=document.getElementById('pSet');if(me.role!=='مدير عام'){el.innerHTML='<div class="empty"><div class="ei">🔒</div><p>غير مصرح</p></div>';return;}
  el.innerHTML=`<div class="sh"><div class="st2">⚙️ الإعدادات</div></div>
  <div class="cd">
    <div class="cdt">🏢 اسم المتجر وشعاره</div>
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">
      <div style="width:52px;height:52px;border-radius:12px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px">${logo?`<img src="${logo}" style="width:100%;height:100%;object-fit:cover">`:'🏢'}</div>
      <button class="btn bac" onclick="uploadLogo()">🖼️ تغيير الشعار</button>
    </div>
    <div class="fg"><label>اسم المتجر</label><input id="snInp" value="${storeName}"></div>
    <button class="btn bac bsm" onclick="saveSN()">💾 حفظ الاسم</button>
  </div>
  <div class="cd">
    <div class="cdt">💵 أسعار الصرف</div>
    <div class="rg" style="margin-bottom:9px">
      <div class="rc b"><div class="rl" style="color:var(--grn)">🛒 شراء</div><div class="rv" style="color:var(--grn)">${buyRate.toLocaleString()}</div></div>
      <div class="rc s"><div class="rl" style="color:var(--red)">💸 مبيع</div><div class="rv" style="color:var(--red)">${sellRate.toLocaleString()}</div></div>
    </div>
    <button class="btn bgo" style="width:100%;justify-content:center;color:#1a1a1a" onclick="editRate()">✏️ تعديل الأسعار</button>
  </div>
  <div class="cd">
    <div class="cdt">🤝 نسبة الشراكة</div>
    <div style="font-size:20px;font-weight:900;color:var(--pur);margin-bottom:5px">${partnerShare}%</div>
    <div style="font-size:9px;color:var(--t2);margin-bottom:8px">نسبتك من أرباح الأصناف الغذائية في القلعة والسوق الغذائي</div>
    <button class="btn bac bsm" onclick="editShare()">✏️ تعديل</button>
  </div>
  <div class="cd">
    <div class="cdt">🏢 الفروع والأقسام</div>
    ${Object.entries(BC).map(([id,v])=>`<div style="padding:5px 0;border-bottom:1px solid var(--brd)"><div style="font-weight:800;font-size:11px">${v.name} ${v.partner?'<span class="bdg bp">شراكة</span>':''}</div><div style="font-size:9px;color:var(--acc)">📍 ${v.addr}</div><div style="font-size:8px;color:var(--t2)">${v.cats.join(' · ')}</div></div>`).join('')}
  </div>`;
}
function saveSN(){const n=document.getElementById('snInp').value.trim();if(!n)return;storeName=n;save();document.getElementById('TN').textContent=n.split(' ').slice(0,2).join(' ');document.getElementById('loginName').textContent=n;if(document.getElementById('pStore').classList.contains('v'))renderStore();toast('✅ تم تحديث الاسم');}
function uploadLogo(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{logo=ev.target.result;localStorage.setItem('gz_logo',logo);updateLogos();toast('✅ تم');if(document.getElementById('pSet').classList.contains('v'))renderSet();};r.readAsDataURL(file);};inp.click();
}
function updateLogos(){
  const lL=document.getElementById('LL'),tI=document.getElementById('TI');
  if(logo){
    if(lL)lL.innerHTML=`<img src="${logo}" style="width:100%;height:100%;object-fit:cover;border-radius:18px">`;
    if(tI)tI.innerHTML=`<img src="${logo}">`;
    document.getElementById('fav').href=logo;document.getElementById('aicon').href=logo;
  }
}
function editRate(){if(me.role!=='مدير عام'){toast('❌ غير مصرح','e');return;}const nb=parseFloat(prompt(`سعر الشراء (${buyRate}):`,buyRate));if(isNaN(nb)||nb<=0)return;const ns=parseFloat(prompt(`سعر المبيع (${sellRate}):`,sellRate));if(isNaN(ns)||ns<=0)return;buyRate=nb;sellRate=ns;save();toast('✅ تم');if(document.getElementById('pStore').classList.contains('v'))renderStore();if(document.getElementById('pSet').classList.contains('v'))renderSet();}
function editShare(){const ns=parseFloat(prompt(`نسبة الشراكة (${partnerShare}%):`,partnerShare));if(isNaN(ns)||ns<0||ns>100)return;partnerShare=ns;save();toast('✅ تم');renderSet();}

// ══ FACEBOOK ══
function openFB(){
  const isAdmin=me.role==='مدير عام';
  document.getElementById('fbList').innerHTML=fbPages.map(p=>`<div style="display:flex;align-items:center;gap:7px;padding:7px;background:var(--bg3);border-radius:9px;margin-bottom:5px"><div style="width:28px;height:28px;background:#1877f2;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></div><div style="flex:1;cursor:pointer" onclick="window.open('${p.url}','_blank')"><div style="font-size:11px;font-weight:800">${p.name}</div><div style="font-size:9px;color:#1877f2">افتح ↗</div></div>${isAdmin?`<button class="btn brd bsm" onclick="delFB(${p.id})">🗑️</button>`:''}</div>`).join('');
  document.getElementById('fbAdd').innerHTML=isAdmin?`<div style="background:var(--bg3);border-radius:9px;padding:9px"><div style="font-size:10px;font-weight:800;margin-bottom:6px">➕ إضافة</div><input id="fbN" placeholder="اسم الصفحة" style="width:100%;padding:6px;background:var(--bg);border:1px solid var(--brd);border-radius:7px;color:var(--txt);font-family:inherit;margin-bottom:4px;font-size:10px"><input id="fbU" placeholder="https://facebook.com/..." style="width:100%;padding:6px;background:var(--bg);border:1px solid var(--brd);border-radius:7px;color:var(--txt);font-family:inherit;margin-bottom:5px;font-size:10px;direction:ltr"><button class="btn bac" style="width:100%;justify-content:center" onclick="addFB()">إضافة</button></div>`:'';
  document.getElementById('mFB').classList.add('v');
}
function addFB(){const name=document.getElementById('fbN')?.value.trim(),url=document.getElementById('fbU')?.value.trim();if(!name||!url){toast('⚠️ مطلوب','e');return;}fbPages.push({id:Date.now(),name,url});save();openFB();toast('✅ تمت الإضافة');}
function delFB(id){fbPages=fbPages.filter(p=>p.id!=id);save();openFB();}

// ══ MESSAGES ══
function openMsgModal(){
  document.getElementById('msgTo').innerHTML=users.filter(u=>u.username!==me.username).map(u=>`<option value="${u.username}">${u.name}</option>`).join('');
  renderChat();
  msgs.filter(m=>m.to===me.username&&!m.read).forEach(m=>m.read=true);
  save();updateMsgBdg();
  document.getElementById('mMsg').classList.add('v');
}
function renderChat(){
  const list=document.getElementById('chatList');
  const myMsgs=msgs.filter(m=>m.from===me.username||m.to===me.username).slice(-30);
  list.innerHTML=myMsgs.map(m=>{
    const isMine=m.from===me.username;
    const sender=isMine?'أنت':users.find(u=>u.username===m.from)?.name||m.from;
    return `<div class="cmsg ${isMine?'mine':''}"><div style="font-size:9px;font-weight:800;color:var(--acc)">${sender}</div><div style="font-size:11px;margin:2px 0">${m.text}</div><div style="font-size:7px;color:var(--t2)">${m.time}</div></div>`;
  }).join('')||'<div class="empty"><p>لا توجد رسائل</p></div>';
  list.scrollTop=list.scrollHeight;
}
function sendMsg(){
  const to=document.getElementById('msgTo').value,text=document.getElementById('msgTxt').value.trim();
  if(!text){toast('⚠️ اكتب رسالة','e');return;}
  const msg={id:Date.now(),from:me.username,to,text,time:new Date().toLocaleString(),read:false};
  msgs.push(msg);save();document.getElementById('msgTxt').value='';renderChat();updateMsgBdg();
  // Notify immediately
  playMsgSound();toast('✅ تم الإرسال');
}
function updateMsgBdg(){const n=msgs.filter(m=>m.to===me?.username&&!m.read).length;const b=document.getElementById('msgBdg');if(b){b.textContent=n;b.style.display=n>0?'flex':'none';}}

// ══ UTILS ══
function openWA(){window.open(`https://wa.me/${PHONE_WA}?text=${encodeURIComponent('مرحباً 👋، أريد الاستفسار عن منتجاتكم')}`,'_blank')}
function openGPS(){window.open(`https://www.google.com/maps?q=${GPS_LAT},${GPS_LNG}`,'_blank')}
function co(id){document.getElementById(id).classList.remove('v')}
function toast(msg,type='k'){
  clearTimeout(toastT);const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=type==='e'?'var(--red)':type==='msg'?'var(--blu)':'var(--grn)';
  t.classList.add('v');toastT=setTimeout(()=>t.classList.remove('v'),2800);
}
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('v')}));
updateCartBdg();
if(logo)updateLogos();
</script>
</body>
</html>
